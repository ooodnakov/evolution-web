[project]
name = "evolution-rl"
version = "0.1.0"
description = "Headless RL environment for the Evolution board game"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "gymnasium>=1.0,<2",
    "pettingzoo>=1.25,<2",
]

[project.optional-dependencies]
train = ["torch>=2.4,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl/python/evolution_rl"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
