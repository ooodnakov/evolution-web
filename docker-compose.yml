services:
  evolution-web:
    image: evolutionweb:latest
    container_name: evolution_web
    depends_on:
      - analytics-db
    ports:
      - '7080:7080'
    volumes:
      - ./shared/models/game/GameSettings.js:/src/evolution-web/shared/models/game/GameSettings.js
    networks:
      - proxy
      - analytics
    environment:
      - ANALYTICS_DASHBOARD_PATH=${ANALYTICS_DASHBOARD_PATH:-analytics}
      - ANALYTICS_PG_HOST=analytics-db
      - ANALYTICS_PG_PORT=${ANALYTICS_PG_PORT:-5432}
      - ANALYTICS_PG_DATABASE=${ANALYTICS_PG_DATABASE:-evolution_analytics}
      - ANALYTICS_PG_USER=${ANALYTICS_PG_USER:-evolution}
      - ANALYTICS_PG_PASSWORD=${ANALYTICS_PG_PASSWORD:-evolution_secret}

  analytics-db:
    image: postgres:14
    container_name: evolution_analytics_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${ANALYTICS_PG_DATABASE:-evolution_analytics}
      - POSTGRES_USER=${ANALYTICS_PG_USER:-evolution}
      - POSTGRES_PASSWORD=${ANALYTICS_PG_PASSWORD:-evolution_secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - analytics

networks:
  proxy:
    external: true
  analytics:
    driver: bridge

volumes:
  db-data:
